name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src/Sims/yula.client

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: src/Sims/yula.client/.next
          retention-days: 1

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      - if: github.event_name == 'pull_request'
        name: Validate PR commits
        # Fork/rebase'de base.sha repo'da bulunamayabilir; merge-base fallback kullan.
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            npx commitlint --from "$BASE" --to HEAD --verbose
          else
            echo "::warning::Could not resolve merge-base; skipping commitlint"
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:deps
      - run: npm run check:i18n

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci
      - run: npm run test:all

      # @vitest/browser-playwright: chromium binary'ı. ubuntu-latest'te
      # OS bağımlılıkları zaten preinstalled → --with-deps (sudo/apt) gerekmez.
      - run: npx playwright install chromium
      - run: npm run test:ui

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      # Build artefaktını indir → sıfırdan build'e gerek kalmaz.
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: src/Sims/yula.client/.next

      - run: npx playwright install chromium
      - run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/Sims/yula.client/test-results/
          retention-days: 7
