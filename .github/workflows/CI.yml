name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # `run:` step'leri yula.client dizininde çalışır.
    # `uses:` action'ları bu working directory'yi BİLMEZ → path'lerde
    # ${{ github.workspace }} ile repo kökü'nden tam yol göster.
    working-directory: src/Sims/yula.client

env:
  # peer dep ERESOLVE hatalarını (--legacy-peer-deps davranışı) CI'da bypass eder
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      - name: Clean build output
        run: rm -rf .next

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ${{ github.workspace }}/src/Sims/yula.client/.next
          retention-days: 1

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      - if: github.event_name == 'pull_request'
        name: Validate PR commits
        # merge-base fallback: fork/rebase'de base.sha repo'da bulunamaz
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            npx commitlint --from "$BASE" --to HEAD --verbose
          else
            echo "::warning::Could not resolve merge-base; skipping commitlint"
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:deps
      - run: npm run check:i18n

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      # test:all → tsx --test (Node runner) + grid testleri; playwright gerekmez
      - run: npm run test:all

      # test:ui → vitest browser mode (chromium)
      - run: npx playwright install chromium
      - run: npm run test:ui

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Sims/yula.client/package-lock.json

      - run: npm ci

      # build artefaktını indir → sıfırdan build'e gerek kalmaz
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: ${{ github.workspace }}/src/Sims/yula.client/.next

      - run: npx playwright install chromium
      - run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/src/Sims/yula.client/test-results/
          retention-days: 7
