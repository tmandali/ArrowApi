# Validate commit messages with Conventional Commits
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm --dir src/Sims/yula.client exec commitlint --config commitlint.config.ts --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: oxlint
      # --no-error-on-unmatched-pattern: yalnızca lint-olmayan dosya
      # (örn. lefthook.yml, .env.example, .md) staged ise "No files found"
      # ile exit 1 vermek yerine temiz geçer; gerçek .ts/.tsx sorunlarında
      # hata hâlâ döner.
      run: pnpm --dir src/Sims/yula.client exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      skip_when_empty: true
    - name: knip
      run: pnpm --dir src/Sims/yula.client run check:deps
      skip_when_empty: true
