[package]
name = "yula"
version = "0.1.0"
description = "Yula Desktop Application with Embedded AI Agent"
authors = ["ArrowApi Team"]
edition = "2021"

[lib]
name = "yula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# API anahtarları için OS seviyesinde güvenli depolama (macOS Keychain / Windows Credential Manager / Linux Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
