commands:
  - id: "new"
    slash: "yeni"
    label: "Yeni sohbet"
    description: "Mevcut konuşmayı ve sohbet geçmişini sıfırla"
    prompt: "/yeni"
    icon: "SquarePen"
    phase: "system"

  - id: "plan"
    slash: "plan"
    label: "Plan Modu"
    description: "Eylemleri doğrudan koşturmak yerine onay için yol haritası (Plan) modu açar"
    prompt: "/plan"
    icon: "ListTodo"
    phase: "system"

  - id: "compact"
    slash: "compact"
    label: "Bağlamı Sıkıştır"
    description: "Aktif sohbet geçmişini ve token bağlamını özetleyerek sıkıştırır"
    prompt: "/compact"
    icon: "Minimize2"
    phase: "system"

  - id: "model"
    slash: "model"
    label: "Model Seç & Listele"
    description: "Kullanılabilir modelleri listeler veya belirtilen modeli seçer"
    prompt: "/model"
    icon: "Cpu"
    phase: "system"

  - id: "provider"
    slash: "provider"
    label: "AI Sağlayıcısı Seç"
    description: "Aktif AI model sağlayıcısını seç (Ollama, Azure, OpenAI...)"
    prompt: "/provider"
    icon: "Layers"
    phase: "system"

  - id: "login"
    slash: "login"
    label: "Giriş / Sağlayıcı Bağla"
    description: "AI sağlayıcısı veya hesap kimlik doğrulaması"
    prompt: "/login"
    icon: "LogIn"
    phase: "system"

  - id: "help"
    slash: "yardim"
    label: "Yardım & Komutlar"
    description: "Komut ve parametre rehberini sohbet akışına yazdırır"
    prompt: "/help"
    icon: "HelpCircle"
    phase: "system"

  - id: "dump"
    slash: "dump"
    label: "Oturumu İndir"
    description: "Tüm adım adım oturum ve olay kaydını JSON olarak indir"
    prompt: "/dump"
    icon: "Download"
    phase: "system"
