commands:
  - id: "grid-analiz"
    slash: "analiz"
    label: "Tablo Analizi & Veri Kalitesi"
    description: "Veri kalitesi ve anomali analizi yaparak problemleri tıklanabilir aksiyon linkleriyle listeler"
    prompt: "/analiz"
    icon: "ShieldAlert"
    phase: "grid"

  - id: "grid-top5"
    slash: "top5"
    label: "En Yüksek 5 Grafik"
    description: "En yüksek ilk 5 kaydı grafikle özetle"
    prompt: "En yüksek ilk 5 kaydı grafikle özetle"
    icon: "BarChart2"
    phase: "grid"

  - id: "grid-sorgu"
    slash: "sorgu"
    label: "Akıllı SQL Sorgusu"
    description: "Serbest SQL sorgusunu düzelterek (tablo, kolon, tarih) grid tablosunda çalıştırır"
    prompt: "/sorgu select * from rapor "
    icon: "Database"
    phase: "grid"

  - id: "grid-kolonlar"
    slash: "kolonlar"
    label: "Kolon Açıklamaları"
    description: "Bu raporun kolonlarını ve şema detaylarını açıkla"
    prompt: "Bu raporun kolonlarını ve şema detaylarını açıkla"
    icon: "FileText"
    phase: "grid"

  - id: "grid-temizle"
    slash: "temizle"
    label: "Görünümü & Filtreleri Sıfırla"
    description: "Aktif filtreleri temizler, gizli kolonları açar ve tabloyu fabrika ayarlarına döndürür"
    prompt: "Aktif filtreleri temizle, gizli kolonları aç ve tabloyu sıfırla"
    icon: "RotateCcw"
    phase: "grid"

  - id: "grid-sirala"
    slash: "sirala"
    label: "Kolona Göre Sırala"
    description: "Tabloyu seçtiğiniz kolona göre artan veya azalan sırada anında sıralar"
    prompt: "Tabloyu en yüksek miktara göre azalan sırala"
    icon: "ArrowUpDown"
    phase: "grid"

  - id: "grid-odak"
    slash: "odak"
    label: "Kolon Odaklanması"
    description: "Sadece önemli kolonları açık bırakıp diğerlerini gizleyerek sade bir görünüm oluşturur"
    prompt: "Sadece kod, açıklama ve miktar kolonlarını göster, diğerlerini gizle"
    icon: "Columns"
    phase: "grid"

  - id: "grid-indir"
    slash: "indir"
    label: "Raporu İndir (Export)"
    description: "Tablodaki aktif veriyi Excel veya CSV formatında bilgisayarınıza indirir"
    prompt: "Bu tablodaki verileri Excel olarak indir"
    icon: "Download"
    phase: "grid"

