commands:
  - id: "grid-analiz"
    slash: "analiz"
    label: "Tablo Analizi & Veri Kalitesi"
    description: "Veri kalitesi ve anomali analizi yaparak problemleri tıklanabilir aksiyon linkleriyle listeler"
    prompt: "/analiz"
    icon: "ShieldAlert"
    phase: "grid"

  - id: "grid-top5"
    slash: "top5"
    label: "En Yüksek 5 Grafik"
    description: "En yüksek ilk 5 kaydı grafikle özetle"
    prompt: "En yüksek ilk 5 kaydı grafikle özetle"
    icon: "BarChart2"
    phase: "grid"

  - id: "grid-sorgu"
    slash: "sorgu"
    label: "Akıllı SQL Sorgusu"
    description: "Serbest SQL sorgusunu düzelterek (tablo, kolon, tarih) grid tablosunda çalıştırır"
    prompt: "/sorgu select * from rapor "
    icon: "Database"
    phase: "grid"

  - id: "grid-kolonlar"
    slash: "kolonlar"
    label: "Kolon Açıklamaları"
    description: "Bu raporun kolonlarını ve şema detaylarını açıkla"
    prompt: "Bu raporun kolonlarını ve şema detaylarını açıkla"
    icon: "FileText"
    phase: "grid"

  - id: "grid-temizle"
    slash: "temizle"
    label: "Filtreleri Sıfırla"
    description: "Aktif filtreleri temizle ve tabloyu sıfırla"
    prompt: "Aktif filtreleri temizle ve tabloyu sıfırla"
    icon: "RotateCcw"
    phase: "grid"
