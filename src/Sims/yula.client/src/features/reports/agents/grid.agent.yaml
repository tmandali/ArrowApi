commands:
  - id: "grid-analiz"
    slash: "analiz"
    label: "Tablo Analizi & Veri Kalitesi"
    description: "Veri kalitesi ve anomali analizi yaparak problemleri tıklanabilir aksiyon linkleriyle listeler"
    prompt: "/analiz"
    icon: "ShieldAlert"
    phase: "grid"

  - id: "grid-temizle"
    slash: "temizle"
    label: "Görünümü & Filtreleri Sıfırla"
    description: "Aktif filtreleri temizler, gizli kolonları açar ve tabloyu fabrika ayarlarına döndürür"
    prompt: "Aktif filtreleri temizle, gizli kolonları aç ve tabloyu sıfırla"
    icon: "RotateCcw"
    phase: "grid"

  - id: "grid-indir"
    slash: "indir"
    label: "Raporu İndir (Export)"
    description: "Tablodaki aktif veriyi Excel veya CSV formatında bilgisayarınıza indirir"
    prompt: "Bu tablodaki verileri Excel olarak indir"
    icon: "Download"
    phase: "grid"
